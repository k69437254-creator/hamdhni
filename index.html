<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حمضني</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7E6;--card:#FFFFFF;--ink:#241838;--mut:#72677F;--line:#E9E1BE;--lime:#BFDC00;--lem:#FFD43B;--red:#E5484D;--plum:#4B2A73;--on:#241838;--sh:0 1px 0 rgba(36,24,56,.06),0 8px 24px -12px rgba(36,24,56,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17101F;--card:#241A33;--ink:#F7F0D2;--mut:#ADA0C0;--line:#3A2D52;--plum:#C2A6F5;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17101F;--card:#241A33;--ink:#F7F0D2;--mut:#ADA0C0;--line:#3A2D52;--plum:#C2A6F5;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Readex Pro',Tahoma,sans-serif;
  line-height:1.7;
  padding-bottom:92px;
  -webkit-user-select:none;
  -moz-user-select:none;
  -ms-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
input, textarea {
  -webkit-user-select:text!important;
  -moz-user-select:text!important;
  -ms-user-select:text!important;
  user-select:text!important;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
.wrap{max-width:660px;margin:auto;padding:12px 14px}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 0 12px}
.logo{font-size:30px;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.logo i{font-style:normal;background:var(--lem);color:var(--on);padding:0 10px;border-radius:14px 14px 14px 4px}
.live{font-size:11px;color:var(--mut);display:flex;gap:5px;align-items:center}
.live b{width:8px;height:8px;border-radius:50%;background:var(--lime);display:inline-block}.live.off b{background:#F5A524}
.ibtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:5px 11px;font:inherit;font-size:14px;cursor:pointer}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
h2{margin:0 0 6px;font-size:20px}h3{margin:0 0 6px;font-size:16px}
.mut{color:var(--mut);font-size:13px}
.hero{background:var(--lem);color:var(--on);border:none;border-radius:28px 28px 28px 6px;padding:22px;position:relative;overflow:hidden}
.hero::after{content:"🍋";position:absolute;left:-14px;bottom:-30px;font-size:130px;opacity:.28;transform:rotate(-14deg)}
.hero h2{font-size:26px;line-height:1.35}.hero p{margin:6px 0 14px;max-width:85%}
.btn{display:inline-block;border:none;background:var(--on);color:#FBF7E6;font:inherit;font-weight:600;padding:12px 20px;border-radius:14px;cursor:pointer;text-decoration:none}
:root[data-theme="dark"] .btn:not(.alt):not(.ghost){background:var(--lem);color:#241838}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.alt):not(.ghost){background:var(--lem);color:#241838}}
.hero .btn{background:#241838!important;color:#FBF7E6!important}
.btn.alt{background:var(--lime);color:#241838}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45}
:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.3}.stat span{font-size:11px;color:var(--mut)}
nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1.5px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
.tab{flex:1;max-width:100px;background:none;border:none;color:var(--mut);font:inherit;font-size:11px;padding:4px;border-radius:12px;cursor:pointer}
.tab span{display:block;font-size:21px;line-height:1.2}
.tab.on{font-weight:700;color:var(--ink)}.tab.on span{filter:none;transform:translateY(-2px)}
.tab.fab span{background:var(--lem);color:#241838;width:50px;height:50px;border-radius:18px 18px 18px 5px;display:grid;place-items:center;margin:-22px auto 2px;font-size:24px;box-shadow:0 6px 16px -6px rgba(36,24,56,.5)}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
input[type=text],input[type=url],input[type=date],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px}
textarea{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--plum);border-color:var(--plum);color:#fff}
:root[data-theme="dark"] .chip.on{color:#17101F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#17101F}}
.seg{display:flex;gap:4px;margin-bottom:14px}.seg i{flex:1;height:6px;border-radius:99px;background:var(--line)}.seg i.on{background:var(--plum)}
input[type=range]{width:100%;accent-color:var(--red)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.tag{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:1px 8px;display:inline-block}
.tag.ok{background:var(--lime);border-color:var(--lime);color:#241838}
.meter{height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.meter div{height:100%;background:linear-gradient(90deg,var(--lime),var(--lem),var(--red))}
.thumbs{display:flex;gap:8px;margin-top:8px}.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:12px;border:1.5px solid var(--line);cursor:pointer}
.av{width:42px;height:42px;border-radius:15px 15px 15px 4px;background:var(--lem);display:grid;place-items:center;font-size:22px;flex:none}
.av.big{width:76px;height:76px;font-size:40px;border-radius:26px 26px 26px 6px}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.emo button{font-size:22px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:4px;cursor:pointer}.emo button.on{border-color:var(--plum);background:var(--lem)}
.opt{display:flex;gap:10px}.opt button{flex:1;text-align:right;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px;font:inherit;color:var(--ink);cursor:pointer}
.opt button.on{border-color:var(--plum);background:var(--card)}.opt b{display:block}
.warn{background:#FFF1D6;color:#5A3A00;border-radius:12px;padding:8px 12px;font-size:13px;margin-top:8px}
.warn.bad{background:#FFE1E1;color:#7A1010}
:root[data-theme="dark"] .warn{background:#3A2C10;color:#FFE2A8}
.g{width:150px;display:block;margin:auto}
.rk{display:flex;align-items:center;gap:12px;cursor:pointer}
.rk .n{width:34px;height:34px;border-radius:50%;background:var(--lem);color:#241838;display:grid;place-items:center;font-weight:700;flex:none}
.dev{text-align:center;background:var(--plum);color:#fff;border:none}
:root[data-theme="dark"] .dev{color:#17101F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dev{color:#17101F}}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#241838;color:#FBF7E6;padding:10px 18px;border-radius:14px;z-index:50;max-width:90%;text-align:center}
.hide{display:none!important}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:grid;place-items:center;padding:16px}.ov img{max-width:100%;max-height:90%;border-radius:14px}
.sw{display:flex;align-items:flex-start;gap:10px;margin-top:12px}.sw input{margin-top:6px;width:18px;height:18px}.sw label{margin:0;font-weight:400}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .22s}@keyframes pop{from{transform:translateY(6px);opacity:.3}}}
.pcov{height:92px;border-radius:24px}
.pcard{margin-top:-26px;position:relative;text-align:center;padding-top:6px}.pav{margin:-52px auto 8px;border:4px solid var(--card)}
.pcard h2{margin:0}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ach .a{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px;text-align:center}.ach .a.lock{opacity:.55}.ach .a b{display:block;font-size:28px}.ach .a.lock b{filter:grayscale(1)}
.sw2{display:flex;gap:8px}.sw2 button{width:44px;height:30px;border-radius:10px;border:2px solid var(--line);cursor:pointer}.sw2 button.on{border-color:var(--ink)}
.contact{display:inline-flex;align-items:center;gap:10px;background:var(--lime);color:#241838;font-weight:700;text-decoration:none;padding:6px 18px 6px 8px;border-radius:99px}
.contact .ci{width:38px;height:38px;border-radius:50%;background:#241838;color:#BFDC00;display:grid;place-items:center}
.dev .tag{background:rgba(255,255,255,.16);border-color:transparent;color:inherit}
.dav{position:relative;margin:0 auto 10px}.dav i{position:absolute;bottom:-4px;left:-4px;font-style:normal;font-size:13px;width:24px;height:24px;border-radius:50%;background:var(--lime);color:#241838;display:grid;place-items:center;border:3px solid var(--plum)}
.dpg{padding:24px 16px}.dpg p{opacity:.9;margin:10px 0 16px}
.lst{margin:0;padding:0;list-style:none}.lst li{padding:8px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.lnk{background:none;border:none;color:var(--plum);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.dph{position:relative;width:116px;height:116px;margin:0 auto 12px}.dph img{width:100%;height:100%;object-fit:cover;object-position:center 30%;border-radius:36px 36px 36px 9px;border:4px solid rgba(255,255,255,.4);box-shadow:0 10px 24px -10px rgba(0,0,0,.6);display:block}.dph i{position:absolute;bottom:-4px;left:-4px;font-style:normal;font-size:13px;width:26px;height:26px;border-radius:50%;background:var(--lime);color:#241838;display:grid;place-items:center;border:3px solid var(--plum)}.dpg .dph{width:136px;height:136px}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div><div class="logo"><i>حمض</i>ني</div><div class="live off" id="live"><b></b><span>جاري الاتصال...</span></div></div>
 <div><button class="ibtn" onclick="go('dev')" aria-label="المطور">👨‍💻</button> <button class="ibtn" id="theme" aria-label="الوضع">🌓</button></div>
</header>
<main id="app"></main>
</div>
<nav id="nav"></nav>
<div class="toast hide" id="toast" role="status"></div>
<div class="ov hide" id="dlg"></div>
<div class="ov hide" id="ov" onclick="this.classList.add('hide')"><img id="ovi" alt="الدليل"></div>

<script>
var PLATS=["تليگرام","واتساب","إنستگرام","تيك توك","سناب شات","إكس (تويتر)","يوتيوب","ديسكورد","ألعاب أونلاين","فيسبوك","أخرى"];
var TYPES=["محمض أصلي","تافه","فضولي يحشر نفسه","سبام وكثرة حچي","يستفز الناس","يتنمر","يتفلسف","يسرق أفكار غيره","مزعج بالكروبات","يدّعي خبرة","ثقيل دم","يعيد نفس النكتة"];
var FREQ=["مرة وحدة","أحيانًا","كل أسبوع","يومياً","كل ساعة وآني أموت 😵"];
var ROLE=["عضو بكروب","حساب عام","لاعب","معلّق","صانع محتوى","ماعرفه"];
var CTX=["بالخاص","بكروب","بالتعليقات","بلايف","بلعبة"];
var GOV=["بغداد","البصرة","نينوى","أربيل","السليمانية","دهوك","كركوك","النجف","كربلاء","الأنبار","ديالى","صلاح الدين","بابل","واسط","ذي قار","ميسان","المثنى","القادسية","حلبجة","برّه العراق"];
var AVS=["🍋","🦅","😎","🧐","🦁","🐯","🦉","🐺","🤓","🥸","👑","🔥","🌶️","🧿","🕵️","🐢"];
var LV=["خفيف","يزعج","حامض","حامض كلش","حمض مركّز ☠️"];
var BAD=/(اقتل|اذبح|احرق|دمّر حياته|انشر\s*عنوان)/;
var K={reports:"R",votes:"V",flags:"F",profiles:"P"};
var S={db:null,uid:"local",R:[],V:[],F:[],P:[],ok:false};
var st={tab:"home",f:{q:"",p:"",t:"",s:"new"},c:"",pr:"all",edit:false,pt:"ov"};
var W=draftLoad(),PE=null;

function today(){return new Date().toISOString().slice(0,10)}
function fresh(){return{step:1,nick:"",plat:"",place:"",placeUrl:"",role:ROLE[0],types:[],sev:5,freq:FREQ[0],ctx:CTX[0],date:today(),desc:"",ev:[],lnk:"",anon:true,ok:false}}
function draftLoad(){try{var d=JSON.parse(localStorage.getItem("hm_draft"));if(d&&d.nick!==undefined){d.ev=[];return Object.assign(fresh(),d)}}catch(e){}return fresh()}
function draftSave(){try{var c=Object.assign({},W);c.ev=[];localStorage.setItem("hm_draft",JSON.stringify(c))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.remove("hide");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.add("hide")},2800)}
function opts(a,sel,ph){return(ph?'<option value="">'+ph+'</option>':'')+a.map(function(x){return'<option'+(x==sel?' selected':'')+'>'+x+'</option>'}).join("")}
function ago(t){var m=Math.max(1,Math.round((Date.now()-t)/60000));if(m<60)return"قبل "+m+" دقيقة";var h=Math.round(m/60);if(h<24)return"قبل "+h+" ساعة";return"قبل "+Math.round(h/24)+" يوم"}
function key(n,p){return n.toLowerCase()+"|"+p}

/* ---------- data layer ---------- */
function lsave(){try{localStorage.setItem("hm_local",JSON.stringify({R:S.R,V:S.V,F:S.F,P:S.P}))}catch(e){toast("المساحة المحلية ممتلئة")}}
function lload(){try{var d=JSON.parse(localStorage.getItem("hm_local"));if(d){S.R=d.R||[];S.V=d.V||[];S.F=d.F||[];S.P=d.P||[]}}catch(e){}}
async function addDoc(c,d){if(S.db){var r=await S.db.collection(c).add(d);return r.id}d.id="l"+Date.now();S[K[c]].push(d);lsave();return d.id}
async function setDoc(c,id,d){if(S.db){await S.db.collection(c).doc(id).set(d)}else{var a=S[K[c]],i=a.findIndex(function(x){return x.id==id});var o=Object.assign({id:id},d);i>-1?a[i]=o:a.push(o);lsave()}}
async function delDoc(c,id){if(S.db){await S.db.collection(c).doc(id).delete()}else{S[K[c]]=S[K[c]].filter(function(x){return x.id!=id});lsave()}}
function sched(){clearTimeout(sched.h);sched.h=setTimeout(function(){if(st.tab=="report"){dupChk();return}if(st.edit)return;if(st.tab=="feed"){fl();return}render()},120)}
async function init(){lload();
 try{if(window.claude&&claude.use){var db=await claude.use("db"),u=await claude.use("user");
  if(db&&u){var id=await u.id();if(id){S.db=db;S.uid=id;S.R=[];S.V=[];S.F=[];S.P=[];
   Object.keys(K).forEach(function(c){db.collection(c).onSnapshot(function(s){S[K[c]]=s.docs.map(function(d){var o=d.data();o.id=d.id;return o});sched()},function(){toast("تعذّر المزامنة")})})}}}}catch(e){}
 S.ok=!!S.db;var l=document.getElementById("live");l.className="live"+(S.ok?"":" off");l.lastChild.textContent=S.ok?"مباشر · مشترك مع الكل":"وضع محلي · سجّل دخول حتى يشتغل المشترك";render()}

/* ---------- derived ---------- */
function myProf(){return S.P.find(function(p){return p.id==S.uid})}
function prof(uid){return S.P.find(function(p){return p.id==uid})}
function flags(r){return S.F.filter(function(f){return f.rid==r.id}).length}
function votes(r){return S.V.filter(function(v){return v.rid==r.id}).length}
function visible(r){return flags(r)<3||r.uid==S.uid}
function vis(){return S.R.filter(visible)}
function cases(list){var m={};(list||vis()).forEach(function(r){var k=key(r.nick,r.plat);var c=m[k]=m[k]||{k:k,nick:r.nick,plat:r.plat,n:0,sev:0,up:0,types:{},last:0};c.n++;c.sev+=r.sev;c.up+=votes(r);r.types.forEach(function(t){c.types[t]=(c.types[t]||0)+1});c.last=Math.max(c.last,r.ts)});
 return Object.keys(m).map(function(k){var c=m[k];c.score=Math.min(100,Math.round(c.sev/c.n*7+c.n*5+c.up*1.5));return c}).sort(function(a,b){return b.score-a.score})}
function lvl(uid){var x=stats(uid,false);return[x.lv[0],x.lv[1]]}
function strength(w){var s=0;if(w.desc.length>=60)s+=20;if(w.desc.length>=150)s+=10;if(w.ev.length)s+=25;if(w.ev.length>1)s+=10;if(/^https?:\/\//.test(w.lnk))s+=15;if(w.place)s+=5;if(w.types.length)s+=5;if(w.date&&(Date.now()-new Date(w.date))<30*864e5)s+=10;return Math.min(100,s)}
function sLbl(s){return s<35?"ضعيف":s<60?"مقبول":s<85?"قوي":"موثّق جدًا"}
function gauge(s){var L=157.08,c=s<35?"var(--lime)":s<65?"var(--lem)":"var(--red)",p='M10 62A50 50 0 0 1 110 62';return'<svg viewBox="0 0 120 70" class="g" role="img" aria-label="الحموضة '+s+'٪"><path d="'+p+'" fill="none" stroke="var(--line)" stroke-width="12" stroke-linecap="round"/><path d="'+p+'" fill="none" stroke="'+c+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(s/100*L)+' '+L+'"/><text x="60" y="58" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)">'+s+'٪</text></svg>'}
function pii(t){if(/(\+?964|\b07\d[\d\s-]{8,})/.test(t)||/\d{9,}/.test(t))return"فيه رقم تلفون أو رقم طويل. شيله حفاظًا على الخصوصية";if(/[\w.-]+@[\w.-]+\.\w+/.test(t))return"فيه إيميل. شيله من الكلام";if(BAD.test(t))return"الكلام فيه تحريض. الهدف نصيحة مو أذى";return""}

/* ---------- helpers ---------- */
function U(x){return decodeURIComponent(x)}
function E(x){return encodeURIComponent(x).replace(/'/g,"%27")}
function ask(msg,cb){var o=document.getElementById("dlg");o.innerHTML='<div class="card" style="max-width:340px;margin:0"><p style="margin:0 0 14px">'+esc(msg)+'</p><div class="row"><button class="btn alt" id="dy">تأكيد</button><button class="btn ghost" id="dn">إلغاء</button></div></div>';o.classList.remove("hide");document.getElementById("dn").onclick=function(){o.classList.add("hide")};document.getElementById("dy").onclick=function(){o.classList.add("hide");cb()}}
function upsert(c,id,d){var a=S[K[c]],i=a.findIndex(function(x){return x.id==id}),o=Object.assign({id:id},d);i>-1?a[i]=o:a.push(o)}
async function saveFile(name,text){try{var dl=window.claude&&await claude.use("downloads");if(dl){await dl.save({filename:name,data:text});return}}catch(e){if(e&&e.code=="declined")return}
 try{await navigator.clipboard.writeText(text);toast("اننسخت البيانات")}catch(e){toast("ما كدرت أنزّل ولا أنسخ")}}
var HOSTS=[[/(^|\.)(t\.me|telegram\.me|telegram\.org)$/,"تليگرام","✈️"],[/(^|\.)(wa\.me|whatsapp\.com)$/,"واتساب","💬"],[/(^|\.)instagram\.com$/,"إنستگرام","📷"],[/(^|\.)tiktok\.com$/,"تيك توك","🎵"],[/(^|\.)snapchat\.com$/,"سناب شات","👻"],[/(^|\.)(x\.com|twitter\.com)$/,"إكس (تويتر)","𝕏"],[/(^|\.)(youtube\.com|youtu\.be)$/,"يوتيوب","▶️"],[/(^|\.)(discord\.gg|discord\.com)$/,"ديسكورد","🎮"],[/(^|\.)(facebook\.com|fb\.com|fb\.watch)$/,"فيسبوك","👍"]];

 if(st.pt=="st")h+='<div class="card"><h3>هويتك الافتراضية بالبلاغات</h3><div class="opt"><button class="'+(p.defAnon!==false?"on":"")+'" onclick="setAnon(true)"><b>👤 مجهول</b></button><button class="'+(p.defAnon===false?"on":"")+'" onclick="setAnon(false)"><b>🙂 بهويتي</b></button></div></div><div class="card"><h3>المظهر</h3><button class="btn ghost" onclick="document.getElementById(\'theme\').click()">🌓 تبديل الفاتح والداكن</button></div><div class="card"><h3>بياناتك</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" onclick="exp()">⬇️ تنزيل بلاغاتي</button><button class="btn ghost" onclick="delAll()">🗑️ حذف كل بلاغاتي</button></div></div><div class="card"><h3>منطقة الخطر</h3><div class="mut" style="margin-bottom:8px">حذف الملف ما يحذف بلاغاتك.</div><button class="btn ghost" style="color:var(--red)" onclick="delP()">حذف ملفي الشخصي</button></div>';
 return h}
function userPg(){var p=prof(st.c);if(!p)return'<button class="btn ghost" onclick="go(\'feed\')">→ رجوع</button><div class="card mut" style="margin-top:10px">هذا الملف مو موجود.</div>';var s=stats(st.c,true);
 return'<button class="btn ghost" style="margin-bottom:10px" onclick="go(\'feed\')">→ رجوع</button>'+cover(p,s)+'<h3 style="margin:16px 4px 8px">بلاغاته العلنية</h3>'+(s.rs.length?s.rs.slice().sort(function(a,b){return b.ts-a.ts}).map(repCard).join(""):'<div class="card mut">ماكو بلاغات علنية.</div>')}
function editP(){var p=myProf();PE={handle:p.handle,gov:p.gov,av:p.av,bio:p.bio||"",cv:p.cv||0,defAnon:p.defAnon!==false};render()}
async function saveP(){var p=myProf(),h=(PE.handle||"").trim().replace(/\s+/g,"_");
 if(!/^[\u0600-\u06FFa-zA-Z0-9_.]{3,20}$/.test(h))return toast("اللقب 3 إلى 20 حرف: حروف وأرقام و _ فقط");
 if(S.P.some(function(x){return x.id!=S.uid&&String(x.handle).toLowerCase()==h.toLowerCase()}))return toast("هذا اللقب مأخوذ، اختار غيره");
 var m=pii(h+" "+PE.bio);if(m)return toast(m);
 var d={handle:h,gov:PE.gov,av:PE.av,bio:PE.bio.trim(),cv:PE.cv,defAnon:PE.defAnon,since:p?p.since||p.ts:Date.now(),ts:Date.now()};
 try{await setDoc("profiles",S.uid,d);upsert("profiles",S.uid,d);W.anon=d.defAnon&&W.step==1&&!W.nick?true:W.anon;PE=null;st.edit=false;toast("انحفظ ملفك ✅");render()}catch(e){toast("ما كدرت أحفظ. يمكن صلاحيتك للقراءة بس")}}
async function setAnon(a){var p=myProf();try{var d=Object.assign({},p,{defAnon:a});delete d.id;await setDoc("profiles",S.uid,d);upsert("profiles",S.uid,d);W.anon=a;toast("تم");render()}catch(e){toast("ما كدرت أحفظ")}}
function delP(){ask("تحذف ملفك الشخصي؟ بلاغاتك تبقى.",async function(){try{await delDoc("profiles",S.uid);S.P=S.P.filter(function(x){return x.id!=S.uid});st.pt="ov";render()}catch(e){toast("ما كدرت أحذف")}})}
function delAll(){var n=S.R.filter(function(r){return r.uid==S.uid}).length;if(!n)return toast("ماكو بلاغات تنحذف");ask("تحذف كل بلاغاتك ("+n+")؟ ما يرجعون.",async function(){try{for(var r of S.R.filter(function(r){return r.uid==S.uid}))await delDoc("reports",r.id);S.R=S.R.filter(function(r){return r.uid!=S.uid});render();toast("انحذفت")}catch(e){toast("وقفت العملية. جرّب مرة ثانية")}})}
function exp(){var j=JSON.stringify(S.R.filter(function(r){return r.uid==S.uid}).map(function(r){var c=Object.assign({},r);delete c.ev;delete c.uid;return c}),null,1);saveFile("hamdhni-reports.json",j)}

function render(){var m={home:home,feed:feed,case:casePg,rank:rank,report:report,me:me,user:userPg,dev:dev};document.getElementById("app").innerHTML='<div class="pop">'+m[st.tab]()+'</div>';nav();if(st.tab=="report"){dc();dupChk();plChk()}}
document.getElementById("theme").onclick=function(){var r=document.documentElement,d=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");r.setAttribute("data-theme",d=="dark"?"light":"dark")};

// منع التحديد القائم على الضغط المطول والنقر الأيمن والنسخ
document.addEventListener('contextmenu', function(e) {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
    }
});
document.addEventListener('selectstart', function(e) {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
    }
});
document.addEventListener('copy', function(e) {
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
        toast("عذراً، نسخ النصوص غير مسموح في هذا التطبيق 🚫");
    }
});

render();init();
