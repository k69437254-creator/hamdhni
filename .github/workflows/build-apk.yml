name: Build Hamdhni Native APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Native Dependencies & CLI
        run: |
          npm install -g @capacitor/cli @capacitor/core

      - name: Initialize Web Assets & Android Platform
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install @capacitor/android @capacitor/core
          npx cap init "Hamdhni" "com.hamdhni.app" --web-dir "." --yes
          npx cap add android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hamdhni-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
